; Same overrides the official install script applies to php.ini
upload_max_filesize = 500M
post_max_size = 500M
max_execution_time = 300

; Container hardening
expose_php = Off

; config.php is rewritten by the setup wizard and by admin settings. With the default
; revalidate_freq=2 a request can be served a just-replaced config.php for up to 2 seconds.
opcache.revalidate_freq = 0
