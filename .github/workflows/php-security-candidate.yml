name: Publish verified PHP security candidate

on:
  push:
    branches: [fix/lab-y-139-php-security]

permissions:
  contents: read
  packages: write

concurrency:
  group: itflow-php-security-candidate
  cancel-in-progress: true

env:
  CANDIDATE_VERSION: v26.09.3-internal-v5-logsafe-20261101
  CANDIDATE_IMAGE: ghcr.io/yoshovski/itflow:v26.09.3-internal-v5-logsafe-20261101

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the candidate with fresh dependencies
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          push: false
          tags: itflow:candidate
          build-args: |
            ITFLOW_VERSION=${{ env.CANDIDATE_VERSION }}
            VCS_REF=${{ github.sha }}
      - name: Verify PHP, required extensions and certificate trust
        timeout-minutes: 5
        run: |
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint php \
            -v "$PWD/docker/check-security.php:/check.php:ro" itflow:candidate /check.php
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint php \
            -v "$PWD/docker/check-security.php:/check.php:ro" itflow:candidate /check.php --online
      - name: Verify installation, Apache, restart and cron in isolation
        timeout-minutes: 10
        run: docker/smoke-test.sh itflow:candidate
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish this exact tested image without changing release tags
        run: |
          docker tag itflow:candidate "$CANDIDATE_IMAGE"
          docker push "$CANDIDATE_IMAGE"
          docker buildx imagetools inspect "$CANDIDATE_IMAGE"
