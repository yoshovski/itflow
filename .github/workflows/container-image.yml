name: Container image

on:
  push:
    tags:
      - "v*-internal*"
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - ".github/workflows/container-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/itflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read ITFlow version
        id: version
        run: |
          version=$(sed -nE 's/.*"APP_VERSION", "([^"]+)".*/\1/p' includes/app_version.php)
          echo "app=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: itflow:test
          build-args: |
            ITFLOW_VERSION=${{ steps.version.outputs.app }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (install + web + cron)
        run: docker/smoke-test.sh itflow:test

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ITFLOW_VERSION=${{ steps.version.outputs.app }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
